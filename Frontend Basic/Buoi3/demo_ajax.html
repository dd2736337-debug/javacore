    <!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />

        <!-- Latest compiled and minified CSS & JS -->

    <body>
        <!-- bs3-container: bo chiều rộng của giao diện lại -->
        <div class="container">
            <form
                id="AccountForm"
                action=""
                class="form-horizontal"
                role="form"
            >
                <div class="form-group">
                    <legend>Quản Lí Account</legend>
                </div>

                <div class="col-xs-8 col-sm-8 col-md-8 col-lg-8">
                    <div class="form-group">
                        <label
                            for="inputUsername"
                            class="col-sm-2 control-label"
                            >Username:</label
                        >
                        <div class="col-sm-10">
                            <input
                                type="text"
                                name="Username"
                                id="inputUsername"
                                class="form-control"
                                required
                            />
                        </div>
                    </div>

                    <div class="form-group">
                        <label
                            for="inputFullname"
                            class="col-sm-2 control-label"
                            >Fullname:</label
                        >
                        <div class="col-sm-10">
                            <input
                                type="text"
                                name="Fullname"
                                id="inputFullname"
                                class="form-control"
                                required
                            />
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="inputAge" class="col-sm-2 control-label"
                            >Age:</label
                        >
                        <div class="col-sm-10">
                            <input
                                type="number"
                                name="Age"
                                id="inputAge"
                                class="form-control"
                                required
                            />
                        </div>
                    </div>
                </div>

                <div class="col-xs-4 col-sm-4 col-md-4 col-lg-4">
                    <div class="form-group">
                        <div class="col-sm-10 col-sm-offset-2">
                            <button type="submit" class="btn btn-primary">
                                Create
                            </button>
                        </div>
                        <div class="col-sm-10 col-sm-offset-2">
                            <button
                                type="button"
                                class="btn btn-info"
                                onclick="onUpdateAccount()"
                            >
                                Update
                            </button>
                        </div>
                    </div>
                </div>
            </form>

            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>FullName</th>
                        <th>Age</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- <tr>
                        <td>1</td>

                    </tr> -->
                </tbody>
            </table>
        </div>
    </body>
    <script>
        var v_id = 4;
        var v_idUpdate = -1;
        var arrays = [
            {
                id: 1,
                username: "Nguyễn",
                fullName: "Nguyễn Văn A",
                age: 20,
            },

            {
                id: 2,
                username: "Trần",
                fullName: "Trần Văn B",
                age: 30,
            },

            {
                id: 3,
                username: "Ngô",
                fullName: "Ngô Thị C",
                age: 25,
            },

            {
                id: 4,
                username: "Lê",
                fullName: "Lê Văn D",
                age: 21,
            },
        ];

        // <tr>
        //                 <td>1</td>
        //                 <td>Username1</td>
        //                 <td>FullName1</td>
        //                 <td>11</td>
        //                 <td>
        //                     <button>Update</button>
        //                     <button>Delete</button>
        //                 </td>
        //             </tr>

        loadData();

        function loadData() {
            var tableContent = "";
            for (let i = 0; i < arrays.length; i++) {
                tableContent += "<tr>";
                tableContent += "<td>" + arrays[i].id + "</td>";
                tableContent += "<td>" + arrays[i].username + "</td>";
                tableContent += "<td>" + arrays[i].fullName + "</td>";
                tableContent += "<td>" + arrays[i].age + "</td>";
                tableContent +=
                    "<td><button onclick='onHandleUpdate(" +
                    arrays[i].id +
                    ")'>Edit</button> <button onclick='onDelete(" +
                    arrays[i].id +
                    ")'>Delete</button></td>";
                tableContent += "</tr>";
            }
            // document.getElementById("tableBody").innerHTML = tableContent; //nối dữ liệu vào table body có id=tableBody
            //Trước khi show data thì clear bảng trước
            //jqEmpty
            $("#tableBody").empty();

            //cú pháp JqAppend
            $("#tableBody").append(tableContent);
        }

        function onDelete(idDelete) {
            var comfirm = confirm("Bạn có chắc chắn xóa account này không?");
            if (comfirm == true) {
                var indexDelete = -1;
                for (let i = 0; i < arrays.length; i++) {
                    if (arrays[i].id == idDelete) {
                        indexDelete = i;

                        break;
                    }
                }
                arrays.splice(indexDelete, 1); //Xóa phần tử theo vị trí,số lượng phần tử muốn xóa
                alert("Xóa thành công");
                loadData(); //Hiển thị lại danh sách
            }
        }

        //JqSubmit
        $("#AccountForm").submit(function (e) {
            e.preventDefault();

            var v_username = $("#inputUsername").val();
            var v_fullname = $("#inputFullname").val();
            var v_age = $("#inputAge").val();

            var account = {
                id: ++v_id,
                username: v_username,
                fullName: v_fullname,
                age: v_age,
            };

            arrays.push(account);
            alert("Thêm dữ liệu thành công");
            loadData();

            $("#inputUsername").val("");
            $("#inputFullname").val("");
            $("#inputAge").val("");
        });

        // function onCreate() {
        //     //lấy dữ liệu từ 3 ô username,fullname,age ở trên
        //     var v_username = $("#inputUsername").val();
        //     var v_fullname = $("#inputFullname").val();
        //     var v_age = $("#inputAge").val();
        //     // console.log(v_username + "," + v_fullname + " ," + v_age);
        //     //đưa các dữ liệu trên vào object và thêm vào arrays
        //     var account = {
        //         id: ++v_id,
        //         username: v_username,
        //         fullName: v_fullname,
        //         age: v_age,
        //     };
        //     arrays.push(account);
        //     //hiển thị lại ds account
        //     loadData();
        //     //clear dữ liệu từ 3 ô username,fullname,age ở trên
        //     // document.getElementById("inputUsername").value = "";
        //     // document.getElementById("inputFullname").value = "";
        //     // document.getElementById("inputAge").value = "";
        //     $("#inputUsername").val("");
        //     $("#inputFullname").val("");
        //     $("#inputAge").val("");
        // }

        function onHandleUpdate(idUpdate) {
            //dựa vào id để show dữ liệu lên các ô input
            for (let i = 0; i < arrays.length; i++) {
                if (arrays[i].id == idUpdate) {
                    $("#inputUsername").val(arrays[i].username);
                    $("#inputFullname").val(arrays[i].fullName);
                    $("#inputAge").val(arrays[i].age);
                    v_idUpdate = idUpdate; //Lưu lại id cần update
                    break;
                }
            }
        }

        function onUpdateAccount() {
            var v_username = $("#inputUsername").val();
            var v_fullname = $("#inputFullname").val();
            var v_age = $("#inputAge").val();
            //tìm vị trí của object cần update trong mảng
            var v_indexUpdate = -1;
            // for (let i = 0; i < arrays.length; i++) {
            //     if (arrays[i].id == v_idUpdate) {
            //         v_indexUpdate = i;
            //         break;
            //     }
            // }

            v_indexUpdate = arrays.findIndex((i) => i.id == v_idUpdate);

            //update giá trị  ở vị trí thứ i =giá trị nhập từ màn hình
            if (v_indexUpdate == -1) {
                alert("Phần tử này không tồn tại");
            } else {
                arrays[v_indexUpdate] = {
                    id: v_idUpdate,
                    username: v_username,
                    fullName: v_fullname,
                    age: v_age,
                };
                alert("Update dữ liệu thành công");
                //hiển thị lại danh sách account
                loadData();

                $("#inputUsername").val("");
                $("#inputFullname").val("");
                $("#inputAge").val("");
            }
        }
    </script>
</html>

</body>
